    <!--
      Two families on purpose. Plus Jakarta Sans is the app's face and covers the
      full Azerbaijani alphabet (ə ş ğ ı ç ö ü) — but it carries no Cyrillic at
      all, and CSS does not fall back per glyph the way iOS and Android do. With
      a bare family name the Russian copy drops all the way to the default
      serif, which is exactly how the app's price list once ended up set in
      Times. Inter is here to catch those glyphs; never remove it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
